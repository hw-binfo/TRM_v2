<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingredients by Genus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f8f8;
      color: #333;
      padding: 2rem;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #4a6cf7;
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #3a5ae0; }
    .back-btn::before { content: "\2190"; font-size: 1.1em; }

    .header { margin-bottom: 1.5rem; }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      font-style: italic;
    }
    .header .sub {
      font-size: 0.88rem;
      color: #888;
      margin-top: 0.35rem;
      font-style: normal;
    }
    .header .sub code {
      background: #eef1fb;
      color: #3a5ae0;
      padding: 0.1em 0.4em;
      border-radius: 3px;
      font-size: 0.92em;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
      color: #333;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: #f5f6fa;
      border-bottom: 1px solid #e0e3eb;
      flex-wrap: wrap;
    }
    .toolbar .count { font-size: 0.85rem; color: #666; white-space: nowrap; }
    .toolbar input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 0.45rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }
    .toolbar input[type="text"]:focus { border-color: #4a6cf7; }

    .table-wrapper { overflow-x: auto; }

    table {
      width: auto;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead th {
      background: #f5f6fa;
      padding: 0.7rem 0.9rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e0e3eb;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody td {
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    tbody tr:hover { background: #f0f3ff; }

    .col-resize-handle {
      position: absolute;
      right: -3px;
      top: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 10;
      background: transparent;
    }
    .col-resize-handle:hover,
    .col-resize-handle.active { background: rgba(74, 108, 247, 0.35); }

    .tag-cell { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag-badge {
      display: inline-block;
      padding: 0.15em 0.55em;
      background: #e8ecff;
      color: #3a5ae0;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .eff-cell { text-align: center; }
    .eff-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4a6cf7;
    }
    .china-check { color: #e04040; font-size: 1.2rem; font-weight: 900; }
    .eff-dash { color: #ccc; font-size: 0.8rem; }

    .ing-link { color: #4a6cf7; text-decoration: none; font-weight: 500; }
    .ing-link:hover { text-decoration: underline; }

    /* The matched part of genus_species, highlighted */
    mark { background: #fff2a8; color: inherit; padding: 0 0.1em; border-radius: 2px; }

    .tag-filter-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #fafafa;
      border-bottom: 1px solid #e0e3eb;
      flex-wrap: wrap;
    }
    .tag-filter-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      white-space: nowrap;
      margin-right: 0.25rem;
    }
    .tag-filter-item {
      display: inline-block;
      padding: 0.2em 0.7em;
      background: #f0f0f0;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .tag-filter-item:hover { background: #e0e3ef; }
    .tag-filter-item.active {
      background: #4a6cf7;
      color: #fff;
      border-color: #4a6cf7;
    }
    .tag-clear-btn {
      margin-left: auto;
      font-size: 0.78rem;
      color: #999;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }
    .tag-clear-btn:hover { color: #4a6cf7; }

    .no-data {
      padding: 3rem;
      text-align: center;
      color: #888;
      font-size: 1rem;
      line-height: 1.7;
    }
    .no-data a { color: #4a6cf7; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">Back to Dashboard</a>

    <div class="header">
      <h1 id="page-title">Ingredients</h1>
      <div class="sub" id="page-sub"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <span class="count" id="count-info">Loading...</span>
        <input type="text" id="search-input" placeholder="Search within these ingredients...">
      </div>
      <div class="tag-filter-bar" id="tag-filter-bar">
        <span class="tag-filter-label">Tags:</span>
        <button class="tag-clear-btn" id="tag-clear-btn" style="display:none;">Clear tags</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="no-data" id="no-data" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="data/auth-guard.js"></script>
  <script>
    function esc(str) {
      var d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    // ── Which genus was clicked in the dendrogram ──
    var params = new URLSearchParams(window.location.search);
    var genusParam = (params.get('genus') || '').trim();
    var taxonParam = (params.get('taxon') || '').trim();
    // Older binomials for the same taxon, sent by the dendrogram (see
    // altTerms() in tools/build_plots.py). The tree follows current taxonomy
    // while the sheet's genus_species often still holds the previous name -
    // leaf "Lactiplantibacillus" vs "Lactobacillus plantarum" in the data.
    var altTerms = (params.get('alt') || '')
      .split('|')
      .map(function (t) { return t.trim(); })
      .filter(Boolean);

    // "Acremonium / Fusidium" carries two genera; match either.
    var genusTokens = genusParam
      .split('/')
      .map(function (p) { return p.trim().split(/\s+/)[0] || ''; })
      .filter(Boolean);

    function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Match the genus as a whole word inside "genus_species", which holds values
    // such as "Bacillus subtilis, Lactobacillus plantarum".
    var genusRe = genusTokens.length
      ? new RegExp('(^|[^A-Za-z])(' + genusTokens.map(escRe).join('|') + ')(?![a-z])', 'i')
      : null;

    // Alternate names are matched as whole phrases, so passing the binomial
    // "Lactobacillus plantarum" never widens the list to every Lactobacillus.
    var altRe = altTerms.length
      ? new RegExp('(^|[^A-Za-z])(' + altTerms.map(escRe).join('|') + ')(?![a-z])', 'i')
      : null;

    function rowMatches(row) {
      var gs = String(row['genus_species'] || '');
      if (!gs) return false;
      if (genusRe && genusRe.test(gs)) return true;
      if (altRe && altRe.test(gs)) return true;
      return false;
    }

    var markTerms = genusTokens.concat(altTerms);
    var markRe = markTerms.length
      ? new RegExp('(' + markTerms.map(escRe).join('|') + ')', 'ig')
      : null;

    document.title = (taxonParam || genusParam || 'Genus') + ' — Ingredients';
    document.getElementById('page-title').textContent = taxonParam || genusParam || 'Ingredients';

    var allRows      = INGREDIENT_DATA;
    // Wide tables use table_columns (info columns minus the long
    // Description field); older data files only have info_columns.
    var infoCols     = META_DATA.table_columns || META_DATA.info_columns || [];
    var efficacyCols = META_DATA.efficacy_columns || [];
    var storedWidths = [];
    var selectedTags = [];

    var genusRows = (genusRe || altRe)
      ? allRows.filter(rowMatches)
      : allRows.slice();

    document.getElementById('page-sub').innerHTML = genusParam
      ? 'Ingredients whose <code>genus_species</code> field contains ' +
        genusTokens.map(function (g) { return '<code>' + esc(g) + '</code>'; }).join(' or ') +
        (altTerms.length
          ? ', or the earlier name ' +
            altTerms.map(function (a) { return '<code>' + esc(a) + '</code>'; }).join(' / ')
          : '') +
        '.'
      : 'No genus was specified — showing every ingredient.';

    // ── Tag filter chips, built from this genus' ingredients only ──
    (function () {
      var tagSet = {};
      genusRows.forEach(function (row) {
        String(row['Tags'] || '').split(',').forEach(function (t) {
          t = t.trim();
          if (t) tagSet[t] = true;
        });
      });
      var bar      = document.getElementById('tag-filter-bar');
      var clearBtn = document.getElementById('tag-clear-btn');
      var allTags  = Object.keys(tagSet).sort();

      if (!allTags.length) { bar.style.display = 'none'; return; }

      allTags.forEach(function (tag) {
        var el = document.createElement('span');
        el.className = 'tag-filter-item';
        el.textContent = '#' + tag;
        el.addEventListener('click', function () {
          var idx = selectedTags.indexOf(tag);
          if (idx === -1) { selectedTags.push(tag); el.classList.add('active'); }
          else { selectedTags.splice(idx, 1); el.classList.remove('active'); }
          clearBtn.style.display = selectedTags.length ? 'inline' : 'none';
          applyFilters();
        });
        bar.insertBefore(el, clearBtn);
      });
      clearBtn.addEventListener('click', function () {
        selectedTags = [];
        bar.querySelectorAll('.tag-filter-item').forEach(function (el) {
          el.classList.remove('active');
        });
        clearBtn.style.display = 'none';
        applyFilters();
      });
    })();

    function applyFilters() {
      var q = document.getElementById('search-input').value.toLowerCase();
      var filtered = genusRows.filter(function (row) {
        if (q) {
          var match = infoCols.some(function (c) {
            return String(row[c] || '').toLowerCase().indexOf(q) !== -1;
          });
          if (!match) return false;
        }
        if (selectedTags.length > 0) {
          var rowTags = String(row['Tags'] || '').split(',').map(function (t) { return t.trim(); });
          for (var i = 0; i < selectedTags.length; i++) {
            if (rowTags.indexOf(selectedTags[i]) === -1) return false;
          }
        }
        return true;
      });
      renderTable(filtered);
      updateCount(filtered.length, genusRows.length);
    }

    function renderTable(rows) {
      var thead  = document.getElementById('table-head');
      var tbody  = document.getElementById('table-body');
      var noData = document.getElementById('no-data');

      var displayInfoCols = infoCols.filter(function (c) { return c !== 'Category'; });

      var headerHtml = '<tr><th>Category</th>';
      displayInfoCols.forEach(function (c) {
        headerHtml += (c === 'China compliant')
          ? '<th class="eff-cell">' + esc(c) + '</th>'
          : '<th>' + esc(c) + '</th>';
      });
      headerHtml += '<th>Tags</th>';
      efficacyCols.forEach(function (c) {
        headerHtml += '<th class="eff-cell">' + esc(c) + '</th>';
      });
      headerHtml += '</tr>';
      thead.innerHTML = headerHtml;

      if (storedWidths.length > 0) {
        var thEls = thead.querySelectorAll('th');
        for (var j = 0; j < thEls.length; j++) {
          if (storedWidths[j]) thEls[j].style.width = storedWidths[j] + 'px';
        }
      }

      if (rows.length === 0) {
        tbody.innerHTML = '';
        noData.innerHTML = genusParam
          ? 'No ingredient records <em>' + esc(genusParam) + '</em> in its ' +
            '<code>genus_species</code> field.<br><a href="browse.html">Browse all ingredients</a>'
          : 'No ingredients found.';
        noData.style.display = 'block';
        attachHandles();
        return;
      }
      noData.style.display = 'none';

      var bodyHtml = '';
      rows.forEach(function (row) {
        bodyHtml += '<tr>';
        bodyHtml += '<td>' + esc(String(row['Category'] || '')) + '</td>';
        displayInfoCols.forEach(function (c) {
          if (c === 'China compliant') {
            bodyHtml += (String(row[c]) === 'Y')
              ? '<td class="eff-cell"><span class="china-check">✔</span></td>'
              : '<td class="eff-cell"></td>';
          } else if (c === 'Ingredient name') {
            bodyHtml += '<td><a class="ing-link" href="ingredient-detail.html?name=' +
              encodeURIComponent(String(row[c] || '')) + '">' +
              esc(String(row[c] || '')) + '</a></td>';
          } else if (c === 'genus_species' && markRe) {
            // Highlight the genus that brought this row into the list.
            bodyHtml += '<td>' +
              esc(String(row[c] || '')).replace(markRe, '<mark>$1</mark>') + '</td>';
          } else {
            bodyHtml += '<td>' + esc(String(row[c] || '')) + '</td>';
          }
        });

        var tagsStr  = String(row['Tags'] || '');
        var tagsHtml = '<td><div class="tag-cell">';
        if (tagsStr) {
          tagsStr.split(',').forEach(function (t) {
            t = t.trim();
            if (t) tagsHtml += '<span class="tag-badge">#' + esc(t) + '</span>';
          });
        }
        bodyHtml += tagsHtml + '</div></td>';

        efficacyCols.forEach(function (c) {
          bodyHtml += (String(row[c]) === 'O')
            ? '<td class="eff-cell"><span class="eff-dot"></span></td>'
            : '<td class="eff-cell"><span class="eff-dash">-</span></td>';
        });
        bodyHtml += '</tr>';
      });
      tbody.innerHTML = bodyHtml;

      requestAnimationFrame(function () { attachHandles(); });
    }

    // --- Column resize ---
    function attachHandles() {
      var table = document.querySelector('table');
      var ths   = Array.prototype.slice.call(table.querySelectorAll('thead th'));
      if (!ths.length) return;

      if (storedWidths.length === 0) {
        storedWidths = ths.map(function (th) {
          return Math.max(50, th.getBoundingClientRect().width);
        });
        table.style.tableLayout = 'fixed';
        ths.forEach(function (th, i) { th.style.width = storedWidths[i] + 'px'; });
      }

      ths.forEach(function (th, i) {
        var old = th.querySelector('.col-resize-handle');
        if (old) old.remove();
        var handle = document.createElement('div');
        handle.className = 'col-resize-handle';
        th.appendChild(handle);

        handle.addEventListener('mousedown', function (e) {
          e.preventDefault();
          var startX = e.clientX;
          var startW = th.getBoundingClientRect().width;
          handle.classList.add('active');
          document.body.style.cursor     = 'col-resize';
          document.body.style.userSelect = 'none';
          function onMove(ev) {
            var w = Math.max(40, startW + (ev.clientX - startX));
            th.style.width  = w + 'px';
            storedWidths[i] = w;
          }
          function onUp() {
            handle.classList.remove('active');
            document.body.style.cursor     = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup',   onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup',   onUp);
        });
      });
    }

    function updateCount(shown, total) {
      var el = document.getElementById('count-info');
      el.textContent = (shown === total)
        ? total + ' ingredient(s)'
        : shown + ' of ' + total + ' ingredient(s)';
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);

    renderTable(genusRows);
    updateCount(genusRows.length, genusRows.length);
  </script>
</body>
</html>
